[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-desk"
version = "1.0.0"
description = "Personal AI investment research desk (Fanding watcher + portfolio decisions)"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "cryptography>=42",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
